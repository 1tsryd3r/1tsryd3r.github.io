---
layout: default
---

<article>
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        {% if page.event %}
        <div class="post-event">{{ page.event }}</div>
        {% endif %}
        <div class="post-meta">
            <span>{{ page.date | date: "%d %b %Y" }}</span>
            {% if page.tags %}
            <span class="tags">
                {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{%
                endfor %}
            </span>
            {% endif %}
        </div>
    </header>
    <div class="post-content">{{ content }}</div>
</article>
