---
layout: default
---

<article>
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="post-meta">
            <span
                >{% if page.display_date %}{{ page.display_date }}{% else %}{{
                page.date | date: "%Y-%m-%d" }}{% endif %}</span
            >
            {% if page.event %}<span>{{ page.event }}</span>{% endif %} {% if
            page.tags %}
            <span class="tags">
                {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{%
                endfor %}
            </span>
            {% endif %}
        </div>
    </header>
    <div class="post-content">{{ content }}</div>
</article>
