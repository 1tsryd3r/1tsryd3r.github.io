---
layout: default
---

<ul class="post-list">
    {% for post in site.posts %}
    <li>
        <a class="post-row" href="{{ post.url | relative_url }}">
            <span class="post-title-wrap">
                <span class="post-title-text">{{ post.title }}</span>
                {% if post.event %}<span class="post-event-sub"
                    >{{ post.event }}</span
                >{% endif %}
            </span>
            <span class="post-right">
                <span class="post-date"
                    >{{ post.date | date: "%d %b %Y" }}</span
                >
                {% if post.tags %}
                <span class="post-tags">
                    {% for tag in post.tags %}<span class="tag">{{ tag }}</span
                    >{% endfor %}
                </span>
                {% endif %}
            </span>
        </a>
    </li>
    {% else %}
    <li style="color: var(--muted); padding: 1rem 0">No writeups yet.</li>
    {% endfor %}
</ul>
